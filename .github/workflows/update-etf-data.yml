name: Update ETF holdings and SEC financial data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-etf-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pandas html5lib

      - name: Update ETF holdings
        run: python etf_holdings.py

      - name: Update SEC financial data
        run: python sec_financials.py

      - name: Validate generated JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for filename in ("etf_holdings.json", "sec_financials.json"):
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"Missing output file: {filename}")
              with path.open(encoding="utf-8") as f:
                  data = json.load(f)
              if not data:
                  raise SystemExit(f"Output file is empty: {filename}")
              print(f"OK: {filename} ({path.stat().st_size} bytes)")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf_holdings.json sec_financials.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update ETF holdings and SEC financial data"
            git push
          fi
