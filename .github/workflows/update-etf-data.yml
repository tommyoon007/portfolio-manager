name: Update ETF holdings and SEC financial data

on:
  schedule:
    - cron: '35 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: portfolio-manager-etf-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --no-cache-dir requests pandas lxml html5lib
      - name: Download official ETF holdings
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python etf_holdings.py
      - name: Fetch SEC company fundamentals
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python sec_financials.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          for name in ('etf_holdings.json', 'sec_financials.json'):
              with open(name, encoding='utf-8') as f: data=json.load(f)
              if not isinstance(data.get('data'), dict) or not data['data']:
                  raise SystemExit(f'{name} has no usable data')
              print(name, 'OK', len(data['data']))
          PY
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add etf_holdings.json sec_financials.json
          git diff --cached --quiet || git commit -m 'Update ETF holdings and SEC fundamentals'
          git push
