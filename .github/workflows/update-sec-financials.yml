name: Update SEC financial data

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch SEC XBRL data
        env:
          SEC_USER_AGENT: "Portfolio Manager GitHub Action (https://github.com/${{ github.repository }})"
        run: python sec_financials.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sec_financials.json
          git diff --cached --quiet || git commit -m "Update SEC financial data"
          git push
